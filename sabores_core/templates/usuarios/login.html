{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-header card-header-custom text-center py-3">
                <h4 class="mb-0">Acceso a la Plataforma</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico:</label>
                        {{ form.email }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña (8 a 12 caracteres alfanuméricos):</label>
                        {{ form.password }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Ingresar</button>
                </form>
                <div class="text-center mt-3">
                    <p class="small text-muted">¿Eres nuevo cliente? <a href="{% url 'registro' %}">Regístrate aquí</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
